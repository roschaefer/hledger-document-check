name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    uses: roschaefer/reusable-workflows/.github/workflows/rust-ci.yml@7a6a4c95ab8c87760c0db34302c6163ed43954b0 # main
    permissions:
      contents: write
    with:
      binary_name: hledger-document-check
      platforms: '["linux-x86_64","macos-arm64"]'
      needs_hledger: true
      needs_fava: true
      needs_scrut: true
