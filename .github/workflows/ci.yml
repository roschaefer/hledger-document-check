name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    uses: roschaefer/reusable-workflows/.github/workflows/rust-ci.yml@23f29aaad0a8b73e4513d3e8340cdace14a08d6e # main
    permissions:
      contents: write
    with:
      binary_name: hledger-document-check
      os_list: '["ubuntu-latest","macos-latest"]'
      needs_hledger: true
      needs_fava: true
