name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    uses: roschaefer/reusable-workflows/.github/workflows/rust-ci.yml@06ebd041daeb876b4fa95944451f4d90aeab4fb5 # main
    permissions:
      contents: write
    with:
      binary_name: hledger-document-check
      platforms: '["linux-x86_64","macos-arm64"]'
      needs_hledger: true
      needs_fava: true
      needs_scrut: true
