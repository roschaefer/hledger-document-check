name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    uses: roschaefer/reusable-workflows/.github/workflows/rust-ci.yml@b02f81648de1b7a9f1ae5b6d00e26dd3c83edec3 # main
    permissions:
      contents: write
    with:
      binary_name: hledger-document-check
      platforms: '["linux-x86_64","macos-arm64"]'
      needs_hledger: true
      needs_fava: true
