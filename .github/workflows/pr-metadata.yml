name: PR metadata

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

jobs:
  pr-metadata:
    uses: roschaefer/reusable-workflows/.github/workflows/pr-metadata.yml@23f29aaad0a8b73e4513d3e8340cdace14a08d6e # main
    permissions:
      pull-requests: read
